[project]
name = "b3-pipeline"
version = "0.1.0"
description = "Coleta histórica de ativos da B3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow",
    "yahoofinance>=0.0.2",
    "yfinance",
]

[project.scripts]
b3-collect = "b3_pipeline.collect:main"
[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"